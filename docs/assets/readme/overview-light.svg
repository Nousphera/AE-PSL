<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">AE-PSL: align twice, then fine-tune</title><desc id="desc">General alignment trains an autoencoder on public features. Client alignment retains local encoders and averages decoders. Fine-tuning freezes compression modules and exchanges compact activations and gradients.</desc><style>:root{--bg:#ffffff;--panel:#f6f8fc;--text:#202936;--muted:#556274;--line:#dce3ed;--accent:#6e42b7}text{font-family:Arial,Helvetica,sans-serif}.stage{animation:emphasize 12s infinite}.s2{animation-delay:4s}.s3{animation-delay:8s}@keyframes emphasize{0%,30%{stroke:var(--accent);stroke-width:2.5}34%,100%{stroke:var(--line);stroke-width:1}}@media(prefers-reduced-motion:reduce){.stage{animation:none;stroke:var(--accent)}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6e42b7" stroke-width="1.5"/></marker></defs><rect width="960" height="600" rx="18" fill="#ffffff"/><text x="32" y="42" fill="var(--text)" font-size="28" font-weight="700" text-anchor="start">AE-PSL</text><text x="32" y="73" fill="var(--muted)" font-size="20" font-weight="400" text-anchor="start">Align twice. Then fine-tune through compact features.</text><rect x="28" y="100" width="904" height="132" rx="12" fill="var(--panel)" stroke="var(--line)" class="stage s1"/><text x="48" y="132" fill="var(--accent)" font-size="17" font-weight="700" text-anchor="start">01</text><text x="48" y="165" fill="var(--text)" font-size="22" font-weight="600" text-anchor="start">General alignment</text><text x="48" y="194" fill="var(--muted)" font-size="16" font-weight="400" text-anchor="start">Public pretrained features</text><rect x="28" y="250" width="904" height="132" rx="12" fill="var(--panel)" stroke="var(--line)" class="stage s2"/><text x="48" y="282" fill="var(--accent)" font-size="17" font-weight="700" text-anchor="start">02</text><text x="48" y="315" fill="var(--text)" font-size="22" font-weight="600" text-anchor="start">Client alignment</text><text x="48" y="344" fill="var(--muted)" font-size="16" font-weight="400" text-anchor="start">Local feature distributions</text><rect x="28" y="400" width="904" height="132" rx="12" fill="var(--panel)" stroke="var(--line)" class="stage s3"/><text x="48" y="432" fill="var(--accent)" font-size="17" font-weight="700" text-anchor="start">03</text><text x="48" y="465" fill="var(--text)" font-size="22" font-weight="600" text-anchor="start">Split fine-tuning</text><text x="48" y="494" fill="var(--muted)" font-size="16" font-weight="400" text-anchor="start">Frozen compression modules</text><rect x="330" y="138" width="12" height="36" rx="3" fill="var(--accent)" stroke="none" /><rect x="348" y="138" width="12" height="36" rx="3" fill="var(--accent)" stroke="none" /><rect x="366" y="138" width="12" height="36" rx="3" fill="var(--accent)" stroke="none" /><text x="350" y="198" fill="var(--muted)" font-size="16" font-weight="400" text-anchor="middle">Features</text><path d="M395 156L435 156" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><rect x="450" y="128" width="92" height="56" rx="12" fill="var(--bg)" stroke="var(--line)" /><text x="496" y="163" fill="var(--text)" font-size="18" font-weight="400" text-anchor="middle">Encoder</text><path d="M550 156L589 156" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><rect x="602" y="141" width="29" height="29" rx="5" fill="var(--accent)" stroke="none" /><text x="617" y="198" fill="var(--muted)" font-size="16" font-weight="400" text-anchor="middle">Latent</text><path d="M643 156L683 156" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><rect x="696" y="128" width="92" height="56" rx="12" fill="var(--bg)" stroke="var(--line)" /><text x="742" y="163" fill="var(--text)" font-size="18" font-weight="400" text-anchor="middle">Decoder</text><path d="M797 156L834 156" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><rect x="848" y="138" width="12" height="36" rx="3" fill="var(--accent)" stroke="none" /><rect x="866" y="138" width="12" height="36" rx="3" fill="var(--accent)" stroke="none" /><rect x="884" y="138" width="12" height="36" rx="3" fill="var(--accent)" stroke="none" /><text x="672" y="220" fill="var(--muted)" font-size="15" font-weight="400" text-anchor="middle">Train the autoencoder with reconstruction loss</text><text x="330" y="284" fill="var(--muted)" font-size="16" font-weight="400" text-anchor="start">Client 1</text><rect x="405" y="265" width="126" height="26" rx="5" fill="var(--bg)" stroke="var(--line)" /><text x="468" y="284" fill="var(--text)" font-size="13" font-weight="400" text-anchor="middle">Encoder + decoder</text><path d="M542 278L642 315" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><text x="330" y="316" fill="var(--muted)" font-size="16" font-weight="400" text-anchor="start">Client 2</text><rect x="405" y="297" width="126" height="26" rx="5" fill="var(--bg)" stroke="var(--line)" /><text x="468" y="316" fill="var(--text)" font-size="13" font-weight="400" text-anchor="middle">Encoder + decoder</text><path d="M542 310L642 315" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><text x="330" y="348" fill="var(--muted)" font-size="16" font-weight="400" text-anchor="start">Client n</text><rect x="405" y="329" width="126" height="26" rx="5" fill="var(--bg)" stroke="var(--line)" /><text x="468" y="348" fill="var(--text)" font-size="13" font-weight="400" text-anchor="middle">Encoder + decoder</text><path d="M542 342L642 315" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><rect x="658" y="287" width="132" height="56" rx="12" fill="var(--bg)" stroke="var(--line)" /><text x="724" y="311" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">Average</text><text x="724" y="331" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">decoders</text><path d="M801 315L845 315" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><text x="874" y="310" fill="var(--text)" font-size="15" font-weight="400" text-anchor="middle">Shared</text><text x="874" y="331" fill="var(--text)" font-size="15" font-weight="400" text-anchor="middle">decoder</text><text x="466" y="372" fill="var(--muted)" font-size="15" font-weight="400" text-anchor="middle">Keep each client’s encoder</text><rect x="329" y="425" width="106" height="53" rx="12" fill="var(--bg)" stroke="var(--line)" /><text x="382.0" y="446" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">Client</text><text x="382.0" y="467" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">model</text><rect x="465" y="425" width="107" height="53" rx="12" fill="var(--bg)" stroke="var(--line)" /><text x="518.5" y="446" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">Frozen</text><text x="518.5" y="467" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">encoder</text><rect x="646" y="425" width="107" height="53" rx="12" fill="var(--bg)" stroke="var(--line)" /><text x="699.5" y="446" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">Frozen</text><text x="699.5" y="467" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">decoder</text><rect x="786" y="425" width="110" height="53" rx="12" fill="var(--bg)" stroke="var(--line)" /><text x="841.0" y="446" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">Server</text><text x="841.0" y="467" fill="var(--text)" font-size="17" font-weight="400" text-anchor="middle">model</text><path d="M438 451L460 451" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><path d="M577 451L639 451" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><path d="M756 451L782 451" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><text x="610" y="418" fill="var(--accent)" font-size="14" font-weight="400" text-anchor="middle">Latents</text><path d="M639 496L577 496" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow)" /><text x="610" y="522" fill="var(--muted)" font-size="15" font-weight="400" text-anchor="middle">Latent gradients</text><text x="32" y="566" fill="var(--muted)" font-size="18" font-weight="400" text-anchor="start">CLS token stays uncompressed · local encoders · one shared decoder</text></svg>
