name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
      - run: python -m pip install -c constraints-tested.txt '.[test]'
      - run: python -m pytest -q
      - run: ae-psl --help
      - run: ae-psl-smoke --seed 42 --output results/smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.python }}
          path: results/smoke.json
